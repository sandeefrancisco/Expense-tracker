<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2563EB" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Expenses" />
  <title>Expenses</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>

  <!-- Loading Screen -->
  <div id="loadingScreen" class="loading-screen">
    <img class="loading-logo" src="icon.svg" alt="Expenses" />
    <div class="loading-ring"></div>
  </div>

  <!-- Auth Screen -->
  <div id="authScreen" class="auth-screen hidden">
    <div class="auth-content">
      <div class="auth-logo-wrap"><img class="auth-logo-icon" src="icon.svg" alt="Expenses" /></div>
      <h1 class="auth-title" id="authTitle">Welcome back</h1>
      <p class="auth-sub" id="authSub">Sign in to your account</p>
      <form id="authForm" novalidate class="auth-form">
        <div class="form-group">
          <label class="form-label" for="emailInput">Email</label>
          <input type="email" id="emailInput" class="form-input" placeholder="you@example.com" autocomplete="email" inputmode="email" />
        </div>
        <div class="form-group">
          <label class="form-label" for="passwordInput">Password</label>
          <input type="password" id="passwordInput" class="form-input" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <div class="auth-error hidden" id="authError"></div>
        <button type="submit" class="submit-btn" id="authSubmitBtn">Sign in</button>
      </form>
      <button class="auth-toggle-btn" id="authToggle">Don't have an account? <strong>Sign up</strong></button>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" class="hidden">

    <header class="header">
      <div class="header-inner">
        <div class="month-nav">
          <button class="icon-btn" id="prevMonth" aria-label="Previous month">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div class="month-display"><span id="monthLabel">May 2026</span></div>
          <button class="icon-btn" id="nextMonth" aria-label="Next month">
            <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>
        <button class="icon-btn" id="openSettings" aria-label="Settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <main class="main">

      <!-- Summary Card -->
      <section class="summary-card">
        <div class="summary-label" id="summaryLabel">Total allocated</div>
        <div class="summary-amount" id="summaryHero">$0.00</div>

        <!-- Earned + Allocated row (when income logged) -->
        <div class="summary-income-row hidden" id="incomeRow">
          <div class="summary-stat">
            <span class="summary-stat-label">Earned</span>
            <span class="summary-stat-value" id="earnedVal">$0.00</span>
          </div>
          <div class="summary-stat-divider"></div>
          <div class="summary-stat">
            <span class="summary-stat-label">Allocated</span>
            <span class="summary-stat-value" id="spentVal">$0.00</span>
          </div>
          <button class="summary-edit-btn" id="editIncomeBtn" aria-label="Edit income">
            <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
        </div>

        <!-- No income yet -->
        <div class="summary-meta" id="summaryMeta">
          <span id="itemCount">0 items</span>
          <span class="dot">·</span>
          <button class="summary-inline-btn" id="logIncomeBtn">+ Log income</button>
        </div>

        <div class="category-bars" id="categoryBars"></div>
      </section>

      <!-- Budget list -->
      <section class="view-section" id="listView">
        <div id="expenseList" class="expense-list"></div>
      </section>

    </main>

    <button class="fab" id="openAdd" aria-label="Add allocation">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>

  </div>

  <!-- ── Add/Edit Allocation Modal ── -->
  <div class="modal-backdrop hidden" id="expenseModal">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">New Allocation</h2>
        <button class="icon-btn" id="closeModal" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="expenseForm" novalidate>
        <div class="form-group amount-group">
          <label class="currency-symbol" id="currencySymbol">$</label>
          <input type="number" id="amountInput" class="amount-input" placeholder="0.00" inputmode="decimal" step="0.01" min="0" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="descInput">Label</label>
          <input type="text" id="descInput" class="form-input" placeholder="e.g. Rent, Groceries, Netflix…" maxlength="80" required />
        </div>
        <div class="form-group">
          <label class="form-label">Category</label>
          <div class="category-grid" id="categoryGrid"></div>
        </div>
        <input type="hidden" id="editId" value="" />
        <div class="form-error hidden" id="formError"></div>
        <button type="submit" class="submit-btn" id="submitBtn">Add Allocation</button>
      </form>
    </div>
  </div>

  <!-- ── Income Modal ── -->
  <div class="modal-backdrop hidden" id="incomeModal">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h2 class="modal-title" id="incomeModalTitle">Income · May 2026</h2>
        <button class="icon-btn" id="closeIncomeModal" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div id="incomeList" class="income-list"></div>

      <div class="income-add-section">
        <div class="settings-label">Add income</div>
        <form id="incomeForm" novalidate>
          <div class="form-group amount-group">
            <label class="currency-symbol" id="incomeCurrencySymbol">$</label>
            <input type="number" id="incomeAmountInput" class="amount-input" placeholder="0.00" inputmode="decimal" step="0.01" min="0" required />
          </div>
          <div class="income-row-fields">
            <div class="form-group" style="flex:1">
              <label class="form-label" for="incomeSourceInput">Source</label>
              <input type="text" id="incomeSourceInput" class="form-input" placeholder="Salary" maxlength="40" />
            </div>
            <div class="form-group" style="flex:1">
              <label class="form-label" for="incomeNoteInput">Note <span class="optional">(opt.)</span></label>
              <input type="text" id="incomeNoteInput" class="form-input" placeholder="Optional" maxlength="80" />
            </div>
          </div>
          <div class="form-error hidden" id="incomeFormError"></div>
          <button type="submit" class="submit-btn" id="addIncomeBtn">Add Income</button>
        </form>
      </div>
    </div>
  </div>

  <!-- ── Settings Modal ── -->
  <div class="modal-backdrop hidden" id="settingsModal">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h2 class="modal-title">Settings</h2>
        <button class="icon-btn" id="closeSettings" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="settings-content">
        <div class="settings-section">
          <div class="settings-label">Account</div>
          <div class="account-row">
            <div class="account-avatar" id="accountAvatar"></div>
            <div class="account-email" id="accountEmail"></div>
          </div>
          <button class="secondary-btn" id="signOutBtn">Sign out</button>
        </div>
        <div class="settings-section">
          <div class="settings-label">Currency</div>
          <div class="currency-options" id="currencyOptions">
            <button class="currency-btn active" data-symbol="$"  data-code="USD">$ USD</button>
            <button class="currency-btn" data-symbol="€"  data-code="EUR">€ EUR</button>
            <button class="currency-btn" data-symbol="£"  data-code="GBP">£ GBP</button>
            <button class="currency-btn" data-symbol="¥"  data-code="JPY">¥ JPY</button>
            <button class="currency-btn" data-symbol="₹"  data-code="INR">₹ INR</button>
            <button class="currency-btn" data-symbol="A$" data-code="AUD">A$ AUD</button>
            <button class="currency-btn" data-symbol="C$" data-code="CAD">C$ CAD</button>
            <button class="currency-btn" data-symbol="Fr" data-code="CHF">Fr CHF</button>
          </div>
        </div>
        <div class="settings-section danger-zone">
          <div class="settings-label">Data</div>
          <button class="danger-btn" id="clearDataBtn">Clear all my data</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Delete Confirm ── -->
  <div class="modal-backdrop hidden" id="deleteModal">
    <div class="modal confirm-modal">
      <div class="confirm-icon">🗑️</div>
      <h3 class="confirm-title">Remove allocation?</h3>
      <p class="confirm-desc">This action cannot be undone.</p>
      <div class="confirm-actions">
        <button class="cancel-btn" id="cancelDelete">Cancel</button>
        <button class="delete-btn" id="confirmDelete">Remove</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast hidden" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
