<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0d2557" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App icon background -->
  <rect width="100" height="100" rx="22" fill="#2563EB"/>

  <!-- Receipt: rounded top corners, zigzag torn bottom -->
  <path filter="url(#s)" fill="white"
    d="M27 14 L73 14 Q78 14 78 19 L78 78
       L75 84 L72 78 L69 84 L66 78 L63 84 L60 78
       L57 84 L54 78 L51 84 L48 78 L45 84 L42 78
       L39 84 L36 78 L33 84 L30 78 L27 84 L24 78
       L24 19 Q24 14 27 14 Z"/>

  <!-- Header bar (light blue tint) -->
  <rect x="31" y="20" width="38" height="5" rx="2.5" fill="#DBEAFE"/>

  <!-- Row 1: label + amount -->
  <rect x="31" y="32" width="23" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="60" y="32" width="10" height="4" rx="2" fill="#BFDBFE"/>

  <!-- Row 2 -->
  <rect x="31" y="41" width="17" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="60" y="41" width="10" height="4" rx="2" fill="#BFDBFE"/>

  <!-- Row 3 -->
  <rect x="31" y="50" width="27" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="60" y="50" width="10" height="4" rx="2" fill="#BFDBFE"/>

  <!-- Separator -->
  <rect x="31" y="60" width="39" height="1" rx="0.5" fill="#E2E8F0"/>

  <!-- Total row (blue) -->
  <rect x="31" y="65" width="13" height="5" rx="2.5" fill="#2563EB" opacity="0.7"/>
  <rect x="55" y="65" width="15" height="5" rx="2.5" fill="#2563EB" opacity="0.7"/>
</svg>
